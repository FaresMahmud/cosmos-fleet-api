<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMOS FLEET — Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --void: #03040d;
          --deep: #070916;
          --nebula: #0d1230;
          --glow-blue: #4d9fff;
          --glow-cyan: #00e5ff;
          --glow-purple: #9d4dff;
          --star: #c8d8ff;
          --text: #ccd6f6;
          --muted: #4a5580;
          --danger: #ff4466;
          --warn: #ffaa00;
          --success: #00ff99;
          --card-bg: rgba(13,18,48,0.75);
          --border: rgba(77,159,255,0.15);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;overflow-x:hidden;background:var(--void);color:var(--text);font-family:'Rajdhani',sans-serif;cursor:none;}
        #cursor{position:fixed;width:10px;height:10px;background:var(--glow-cyan);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .15s,width .2s,height .2s;box-shadow:0 0 10px var(--glow-cyan),0 0 20px rgba(0,229,255,.4);}
        #cursor-ring{position:fixed;width:34px;height:34px;border:1px solid rgba(0,229,255,.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s;}
        #starfield{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;}
        .nebula-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 30%,rgba(77,79,255,.07) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 80% 70%,rgba(157,77,255,.07) 0%,transparent 60%);pointer-events:none;}
        body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:9990;}
        nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:rgba(3,4,13,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
        .nav-logo{display:flex;align-items:center;gap:12px;}
        .nav-logo-ring{width:32px;height:32px;position:relative;display:flex;align-items:center;justify-content:center;}
        .nav-logo-ring::before{content:'';position:absolute;inset:0;border:2px solid var(--glow-cyan);border-radius:50%;animation:spin 8s linear infinite;}
        .nav-logo-ring::after{content:'';position:absolute;inset:4px;border:1px solid var(--glow-purple);border-radius:50%;animation:spin 5s linear infinite reverse;}
        .nav-logo-dot{width:6px;height:6px;background:var(--glow-cyan);border-radius:50%;box-shadow:0 0 8px var(--glow-cyan);}
        .nav-title{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 15px var(--glow-cyan);}
        .nav-tabs{display:flex;gap:4px;}
        .nav-tab{padding:8px 20px;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:none;transition:all .25s;background:transparent;border:1px solid transparent;color:var(--muted);}
        .nav-tab:hover{color:var(--text);border-color:var(--border);}
        .nav-tab.active{color:var(--glow-cyan);border-color:rgba(0,229,255,.3);background:rgba(0,229,255,.05);}
        .nav-status{display:flex;align-items:center;gap:8px;font-size:.7rem;letter-spacing:2px;color:var(--muted);}
        .status-dot{width:6px;height:6px;background:var(--success);border-radius:50%;box-shadow:0 0 8px var(--success);animation:pulse 2s infinite;}
        @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        @keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
        @keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
        @keyframes toastOut{from{opacity:1;}to{opacity:0;transform:translateX(20px);}}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:.5;}}
        #app{position:relative;z-index:1;padding-top:64px;}
        .page{display:none;padding:40px;max-width:1400px;margin:0 auto;}
        .page.active{display:block;}
        .sec-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
        .sec-title{font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:4px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
        .sec-line{flex:1;height:1px;background:var(--border);}
        .stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;}
        .stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px 24px;backdrop-filter:blur(20px);position:relative;overflow:hidden;}
        .stat-card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--glow-cyan),transparent);opacity:.5;}
        .stat-label{font-size:.65rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
        .stat-value{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:700;color:#fff;}
        .stat-value span{font-size:.9rem;color:var(--muted);font-weight:400;}
        .frota-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:24px;}
        .nave-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:28px;backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s;animation:fadeInUp .5s ease both;}
        .nave-card:hover{transform:translateY(-6px);border-color:rgba(77,159,255,.3);box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 40px rgba(77,159,255,.08);}
        .nave-card::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--glow-cyan),transparent);opacity:0;transition:opacity .3s;}
        .nave-card:hover::before{opacity:1;}
        .card-glow{position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;opacity:.04;pointer-events:none;transition:opacity .3s;}
        .nave-card:hover .card-glow{opacity:.08;}
        .glow-blue{background:var(--glow-blue);}.glow-purple{background:var(--glow-purple);}.glow-cyan{background:var(--glow-cyan);}
        .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;}
        .card-identity{display:flex;align-items:center;gap:14px;}
        .nave-icon{width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;font-size:1.5rem;}
        .nave-name{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;color:#fff;letter-spacing:1px;margin-bottom:4px;}
        .nave-tipo-label{font-size:.7rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
        .tipo-badge{padding:4px 10px;border-radius:6px;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;border:1px solid;}
        .badge-cargueiro{color:#ffaa00;border-color:rgba(255,170,0,.3);background:rgba(255,170,0,.05);}
        .badge-combate{color:#ff6688;border-color:rgba(255,100,136,.3);background:rgba(255,100,136,.05);}
        .badge-exploracao{color:#00e5ff;border-color:rgba(0,229,255,.3);background:rgba(0,229,255,.05);}
        .fuel-section{margin-bottom:18px;}
        .fuel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
        .fuel-label{font-size:.7rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
        .fuel-value{font-family:'Orbitron',sans-serif;font-size:.8rem;color:var(--text);}
        .fuel-pct{font-size:.7rem;color:var(--muted);margin-left:6px;}
        .fuel-track{height:5px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;}
        .fuel-bar{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.4,0,.2,1);position:relative;}
        .fuel-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);background-size:200% 100%;animation:shimmer 2s infinite;}
        .fuel-bar.alto{background:linear-gradient(90deg,#0066ff,#00e5ff);box-shadow:0 0 10px rgba(0,229,255,.5);}
        .fuel-bar.medio{background:linear-gradient(90deg,#cc6600,#ffaa00);box-shadow:0 0 10px rgba(255,170,0,.5);}
        .fuel-bar.baixo{background:linear-gradient(90deg,#990022,#ff4466);box-shadow:0 0 10px rgba(255,68,102,.5);animation:blink 1s infinite;}
        .extras{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
        .extra-tag{padding:4px 10px;border-radius:6px;font-size:.68rem;letter-spacing:1px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--muted);}
        .extra-tag.on{color:var(--success);border-color:rgba(0,255,153,.2);background:rgba(0,255,153,.04);}
        .extra-tag.warn{color:var(--warn);border-color:rgba(255,170,0,.2);}
        .divider{height:1px;background:var(--border);margin:16px 0;}
        .acoes{display:flex;flex-direction:column;gap:10px;}
        .acao-row{display:flex;gap:8px;align-items:center;}
        .acao-input{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 13px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:.9rem;letter-spacing:1px;outline:none;transition:border-color .2s,background .2s;cursor:none;}
        .acao-input::placeholder{color:var(--muted);}
        .acao-input:focus{border-color:rgba(77,159,255,.4);background:rgba(77,159,255,.04);}
        .acao-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid;font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:none;transition:all .25s;white-space:nowrap;background:transparent;}
        .btn-viajar{color:var(--glow-blue);border-color:rgba(77,159,255,.3);}
        .btn-viajar:hover{background:rgba(77,159,255,.1);box-shadow:0 0 20px rgba(77,159,255,.2);border-color:var(--glow-blue);}
        .btn-abastecer{color:var(--success);border-color:rgba(0,255,153,.3);}
        .btn-abastecer:hover{background:rgba(0,255,153,.08);border-color:var(--success);}
        .btn-deletar{color:var(--danger);border-color:rgba(255,68,102,.3);}
        .btn-deletar:hover{background:rgba(255,68,102,.08);border-color:var(--danger);}
        .btn-3d{color:var(--glow-purple);border-color:rgba(157,77,255,.3);}
        .btn-3d:hover{background:rgba(157,77,255,.08);border-color:var(--glow-purple);}
        .acao-btn:active{transform:scale(.96);}
        .toast-container{position:fixed;bottom:32px;right:32px;z-index:1000;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
        .toast{display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:12px;font-size:.85rem;letter-spacing:.5px;backdrop-filter:blur(20px);border:1px solid;animation:toastIn .3s ease,toastOut .3s ease 2.7s both;max-width:360px;}
        .toast.sucesso{background:rgba(0,255,153,.08);border-color:rgba(0,255,153,.3);color:var(--success);}
        .toast.erro{background:rgba(255,68,102,.08);border-color:rgba(255,68,102,.3);color:var(--danger);}
        .form-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:36px;backdrop-filter:blur(20px);max-width:640px;animation:fadeInUp .4s ease;}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
        .form-group{display:flex;flex-direction:column;gap:6px;}
        .form-group.full{grid-column:1/-1;}
        .form-label{font-size:.68rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
        .form-input,.form-select{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;cursor:none;width:100%;}
        .form-input:focus,.form-select:focus{border-color:rgba(77,159,255,.4);background:rgba(77,159,255,.04);}
        .form-select option{background:#0d1230;color:var(--text);}
        .extras-form{display:none;grid-column:1/-1;}
        .extras-form.visible{display:contents;}
        .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;}
        .toggle-label{font-size:.9rem;color:var(--text);}
        .toggle{position:relative;width:40px;height:22px;}
        .toggle input{opacity:0;width:0;height:0;}
        .slider{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:999px;cursor:none;transition:.3s;}
        .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.3s;}
        .toggle input:checked+.slider{background:rgba(0,255,153,.2);border:1px solid rgba(0,255,153,.4);}
        .toggle input:checked+.slider::before{transform:translateX(18px);background:var(--success);}
        .btn-criar{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(0,229,255,.3);background:rgba(0,229,255,.06);color:var(--glow-cyan);font-family:'Orbitron',sans-serif;font-size:.8rem;letter-spacing:3px;cursor:none;transition:all .3s;margin-top:8px;}
        .btn-criar:hover{background:rgba(0,229,255,.12);box-shadow:0 0 30px rgba(0,229,255,.15);}
        .historico-list{display:flex;flex-direction:column;gap:10px;}
        .hist-item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:16px;padding:14px 20px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(20px);animation:fadeInUp .3s ease both;}
        .hist-icon{font-size:1.2rem;}
        .hist-nome{font-family:'Orbitron',sans-serif;font-size:.8rem;color:var(--text);margin-bottom:3px;}
        .hist-data{font-size:.7rem;color:var(--muted);letter-spacing:1px;}
        .hist-dist{font-family:'Orbitron',sans-serif;font-size:.85rem;color:var(--glow-blue);text-align:right;}
        .hist-consumo{font-size:.7rem;color:var(--muted);letter-spacing:1px;text-align:right;}
        .hist-empty{text-align:center;padding:60px;color:var(--muted);font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:3px;}
        #modal-3d{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(3,4,13,.92);backdrop-filter:blur(16px);}
        #modal-3d.open{display:flex;}
        .modal-inner{position:relative;width:700px;max-width:95vw;}
        .modal-close{position:absolute;top:-48px;right:0;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.8rem;letter-spacing:2px;padding:6px 14px;cursor:none;transition:all .2s;}
        .modal-close:hover{color:var(--danger);border-color:rgba(255,68,102,.4);}
        #canvas-3d{width:100%;height:480px;border-radius:20px;border:1px solid var(--border);display:block;background:rgba(7,9,22,.8);}
        .modal-info{margin-top:16px;text-align:center;}
        .modal-nave-name{font-family:'Orbitron',sans-serif;font-size:1rem;color:#fff;letter-spacing:3px;margin-bottom:4px;}
        .modal-hint{font-size:.75rem;color:var(--muted);letter-spacing:2px;}
        ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--void);}::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px;}
        .loading{text-align:center;padding:80px 0;color:var(--muted);font-family:'Orbitron',sans-serif;font-size:.8rem;letter-spacing:4px;}
    </style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="nebula-bg"></div>
<div id="cursor"></div>
<div id="cursor-ring"></div>
<div class="toast-container" id="toasts"></div>

<div id="modal-3d">
    <div class="modal-inner">
        <button class="modal-close" onclick="fechar3D()">✕ FECHAR</button>
        <canvas id="canvas-3d"></canvas>
        <div class="modal-info">
            <div class="modal-nave-name" id="modal-nome"></div>
            <div class="modal-hint">🖱 Arraste para girar · Scroll para zoom</div>
        </div>
    </div>
</div>

<nav>
    <div class="nav-logo">
        <div class="nav-logo-ring"><div class="nav-logo-dot"></div></div>
        <span class="nav-title">COSMOS</span>
    </div>
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="irPara('frota',this)">⬡ Frota</button>
        <button class="nav-tab" onclick="irPara('adicionar',this)">＋ Nova Nave</button>
        <button class="nav-tab" onclick="irPara('historico',this)">◈ Histórico</button>
    </div>
    <div class="nav-status"><div class="status-dot"></div>SISTEMA ONLINE</div>
</nav>

<div id="app">
    <div class="page active" id="page-frota">
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-label">Naves na Frota</div><div class="stat-value" id="stat-naves">—</div></div>
            <div class="stat-card"><div class="stat-label">Combustível Médio</div><div class="stat-value" id="stat-comb">—<span>%</span></div></div>
            <div class="stat-card"><div class="stat-label">Naves em Alerta</div><div class="stat-value" id="stat-alerta" style="color:var(--danger)">—</div></div>
        </div>
        <div class="sec-header"><span class="sec-title">Frota Ativa</span><div class="sec-line"></div></div>
        <div class="frota-grid" id="frota"><div class="loading">CARREGANDO FROTA...</div></div>
    </div>

    <div class="page" id="page-adicionar">
        <div class="sec-header"><span class="sec-title">Recrutar Nova Nave</span><div class="sec-line"></div></div>
        <div class="form-card">
            <div class="form-grid">
                <div class="form-group full">
                    <label class="form-label">Identificador</label>
                    <input class="form-input" id="f-id" placeholder="Nome ou código da nave" type="text">
                </div>
                <div class="form-group">
                    <label class="form-label">Tipo</label>
                    <select class="form-select" id="f-tipo" onchange="atualizarFormExtras()">
                        <option value="">— Selecionar —</option>
                        <option value="cargueiro">📦 Cargueiro</option>
                        <option value="combate">⚔️ Combate</option>
                        <option value="exploracao">🔭 Exploração</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Velocidade Base</label>
                    <input class="form-input" id="f-vel" placeholder="Ex: 120" type="number">
                </div>
                <div class="form-group">
                    <label class="form-label">Combustível Máximo</label>
                    <input class="form-input" id="f-comb" placeholder="Ex: 1000" type="number">
                </div>
                <div class="form-group extras-form" id="extra-cargueiro">
                    <label class="form-label">Cap. Máxima de Carga</label>
                    <input class="form-input" id="f-carga" placeholder="Ex: 500" type="number">
                </div>
                <div class="form-group extras-form" id="extra-combate-armas">
                    <label class="form-label">Número de Armas</label>
                    <input class="form-input" id="f-armas" placeholder="Ex: 4" type="number">
                </div>
                <div class="form-group extras-form" id="extra-combate-escudo">
                    <label class="form-label">Escudo</label>
                    <div class="toggle-row"><span class="toggle-label">Escudo Ativado</span><label class="toggle"><input type="checkbox" id="f-escudo"><span class="slider"></span></label></div>
                </div>
                <div class="form-group extras-form" id="extra-exploracao">
                    <label class="form-label">Sensores</label>
                    <div class="toggle-row"><span class="toggle-label">Sensores Avançados</span><label class="toggle"><input type="checkbox" id="f-sensores"><span class="slider"></span></label></div>
                </div>
            </div>
            <button class="btn-criar" onclick="criarNave()">⊕ RECRUTAR NAVE</button>
        </div>
    </div>

    <div class="page" id="page-historico">
        <div class="sec-header">
            <span class="sec-title">Histórico de Viagens</span>
            <div class="sec-line"></div>
            <button class="nav-tab" onclick="carregarHistorico()" style="padding:6px 14px;font-size:.75rem;">↻ Atualizar</button>
        </div>
        <div class="historico-list" id="historico-list"><div class="loading">CARREGANDO...</div></div>
    </div>
</div>

<script>
    /* CURSOR */
    const cursor=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
    (function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
    function bindCursor(){document.querySelectorAll('button,input,select').forEach(el=>{el.addEventListener('mouseenter',()=>{cursor.style.transform='translate(-50%,-50%) scale(2)';ring.style.width='50px';ring.style.height='50px';});el.addEventListener('mouseleave',()=>{cursor.style.transform='translate(-50%,-50%) scale(1)';ring.style.width='34px';ring.style.height='34px';});});}
    bindCursor();

    /* STARFIELD */
    const cv=document.getElementById('starfield'),cx=cv.getContext('2d');
    let stars=[];
    function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
    function initStars(){stars=Array.from({length:300},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.2+.2,speed:Math.random()*.4+.05,op:Math.random()*.7+.1,tw:Math.random()*Math.PI*2}));}
    function drawStars(){cx.clearRect(0,0,cv.width,cv.height);stars.forEach(s=>{s.y+=s.speed;s.tw+=.02;if(s.y>cv.height){s.y=0;s.x=Math.random()*cv.width;}const o=s.op*(.7+.3*Math.sin(s.tw));cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=`rgba(200,216,255,${o})`;cx.fill();});requestAnimationFrame(drawStars);}
    window.addEventListener('resize',()=>{resize();initStars();});
    resize();initStars();drawStars();

    /* NAV */
    function irPara(pg,btn){
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
      document.getElementById('page-'+pg).classList.add('active');
      if(btn)btn.classList.add('active');
      if(pg==='frota')carregarFrota();
      if(pg==='historico')carregarHistorico();
    }

    /* TIPOS */
    function detectarTipo(n){if('pesoCargaAtual' in n)return 'cargueiro';if('numeroArmas' in n)return 'combate';return 'exploracao';}
    const tipoInfo={cargueiro:{icon:'📦',label:'Cargueiro',badge:'badge-cargueiro',glow:'glow-blue'},combate:{icon:'⚔️',label:'Combate',badge:'badge-combate',glow:'glow-purple'},exploracao:{icon:'🔭',label:'Exploração',badge:'badge-exploracao',glow:'glow-cyan'}};

    function renderExtras(nave,tipo){
      let t='';
      if(tipo==='cargueiro')t+=`<span class="extra-tag warn">⚖ Carga: ${nave.pesoCargaAtual}/${nave.capacidadeMaximaCarga}t</span>`;
      if(tipo==='combate'){t+=`<span class="extra-tag warn">⚔ Armas: ${nave.numeroArmas}</span>`;t+=`<span class="extra-tag ${nave.escudoAtivado?'on':''}">🛡 Escudo: ${nave.escudoAtivado?'ON':'OFF'}</span>`;}
      if(tipo==='exploracao')t+=`<span class="extra-tag ${nave.possuiSensoresAvancados?'on':''}">📡 Sensores: ${nave.possuiSensoresAvancados?'ON':'OFF'}</span>`;
      return t?`<div class="extras">${t}</div>`:'';
    }

    function renderCard(nave,i){
      const tipo=detectarTipo(nave),info=tipoInfo[tipo];
      const pct=(nave.combustivelAtual/nave.combustivelMaximo*100).toFixed(1);
      const nivel=pct>60?'alto':pct>25?'medio':'baixo';
      const sid=nave.identificador.replace(/[^a-zA-Z0-9]/g,'_');
      const enc=encodeURIComponent(nave.identificador);
      return `<div class="nave-card" style="animation-delay:${i*.1}s">
        <div class="card-glow ${info.glow}"></div>
        <div class="card-top">
          <div class="card-identity"><div class="nave-icon">${info.icon}</div><div><div class="nave-name">${nave.identificador}</div><div class="nave-tipo-label">${info.label}</div></div></div>
          <div class="tipo-badge ${info.badge}">${info.label}</div>
        </div>
        <div class="fuel-section">
          <div class="fuel-header"><span class="fuel-label">⛽ Combustível</span><span class="fuel-value">${nave.combustivelAtual.toFixed(0)}<span class="fuel-pct">/ ${nave.combustivelMaximo} (${pct}%)</span></span></div>
          <div class="fuel-track"><div class="fuel-bar ${nivel}" style="width:${pct}%"></div></div>
        </div>
        ${renderExtras(nave,tipo)}
        <div class="divider"></div>
        <div class="acoes">
          <div class="acao-row">
            <input class="acao-input" type="number" id="dist-${sid}" placeholder="Distância em anos-luz" min="1">
            <button class="acao-btn btn-viajar" onclick="viajar('${nave.identificador}','${sid}','${enc}')">🚀 Viajar</button>
          </div>
          <div class="acao-row">
            <input class="acao-input" type="number" id="comb-${sid}" placeholder="Qtd. combustível" min="1">
            <button class="acao-btn btn-abastecer" onclick="abastecer('${nave.identificador}','${sid}','${enc}')">⛽ Abastecer</button>
          </div>
          <div class="acao-row" style="justify-content:space-between;">
            <button class="acao-btn btn-3d" onclick="abrir3D('${nave.identificador}','${tipo}')">◈ Ver em 3D</button>
            <button class="acao-btn btn-deletar" onclick="deletar('${nave.identificador}','${enc}')">✕ Remover</button>
          </div>
        </div>
      </div>`;
    }

    function atualizarStats(naves){
      document.getElementById('stat-naves').textContent=naves.length;
      const m=naves.reduce((a,n)=>a+(n.combustivelAtual/n.combustivelMaximo*100),0)/naves.length;
      document.getElementById('stat-comb').innerHTML=m.toFixed(0)+'<span>%</span>';
      document.getElementById('stat-alerta').textContent=naves.filter(n=>n.combustivelAtual/n.combustivelMaximo<.25).length;
    }

    async function carregarFrota(){
      document.getElementById('frota').innerHTML='<div class="loading">CARREGANDO FROTA...</div>';
      try{const data=await(await fetch('/naves')).json();atualizarStats(data);document.getElementById('frota').innerHTML=data.length?data.map((n,i)=>renderCard(n,i)).join(''):'<div class="loading">FROTA VAZIA</div>';bindCursor();}
      catch(e){document.getElementById('frota').innerHTML='<div class="loading">FALHA NA CONEXÃO</div>';}
    }

    function toast(msg,tipo){const el=document.createElement('div');el.className=`toast ${tipo}`;el.innerHTML=`<span>${tipo==='sucesso'?'✓':'✕'}</span> ${msg}`;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3100);}

    async function viajar(nome,sid,enc){const v=document.getElementById('dist-'+sid).value;if(!v)return toast('Digite uma distância!','erro');const r=await fetch(`/naves/${enc}/viajar?distancia=${v}`,{method:'POST'});toast(await r.text(),r.ok?'sucesso':'erro');if(r.ok)carregarFrota();}
    async function abastecer(nome,sid,enc){const v=document.getElementById('comb-'+sid).value;if(!v)return toast('Digite uma quantidade!','erro');const r=await fetch(`/naves/${enc}/abastecer?quantidade=${v}`,{method:'PATCH'});toast(await r.text(),r.ok?'sucesso':'erro');if(r.ok)carregarFrota();}
    async function deletar(nome,enc){if(!confirm(`Remover "${nome}" da frota?`))return;const r=await fetch(`/naves/${enc}`,{method:'DELETE'});toast(await r.text(),r.ok?'sucesso':'erro');if(r.ok)carregarFrota();}

    function atualizarFormExtras(){
      const tipo=document.getElementById('f-tipo').value;
      document.querySelectorAll('.extras-form').forEach(e=>e.classList.remove('visible'));
      if(tipo==='cargueiro')document.getElementById('extra-cargueiro').classList.add('visible');
      if(tipo==='combate'){document.getElementById('extra-combate-armas').classList.add('visible');document.getElementById('extra-combate-escudo').classList.add('visible');}
      if(tipo==='exploracao')document.getElementById('extra-exploracao').classList.add('visible');
    }

    async function criarNave(){
      const id=document.getElementById('f-id').value.trim(),tipo=document.getElementById('f-tipo').value,vel=parseFloat(document.getElementById('f-vel').value),comb=parseFloat(document.getElementById('f-comb').value);
      if(!id||!tipo||!vel||!comb)return toast('Preencha todos os campos obrigatórios!','erro');
      const body={identificador:id,tipo,velocidadeBase:vel,combustivelMaximo:comb};
      if(tipo==='cargueiro')body.capacidadeMaximaCarga=parseFloat(document.getElementById('f-carga').value)||0;
      if(tipo==='combate'){body.numeroArmas=parseInt(document.getElementById('f-armas').value)||0;body.escudoAtivado=document.getElementById('f-escudo').checked;}
      if(tipo==='exploracao')body.possuiSensoresAvancados=document.getElementById('f-sensores').checked;
      const r=await fetch('/naves',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok){toast('Nave recrutada com sucesso!','sucesso');document.getElementById('f-id').value='';document.querySelector('.nav-tab').click();}
      else toast(await r.text(),'erro');
    }

    async function carregarHistorico(){
      document.getElementById('historico-list').innerHTML='<div class="loading">CARREGANDO...</div>';
      const data=await(await fetch('/naves/historico')).json();
      if(!data.length){document.getElementById('historico-list').innerHTML='<div class="hist-empty">NENHUMA VIAGEM REGISTRADA</div>';return;}
      document.getElementById('historico-list').innerHTML=data.slice().reverse().map((v,i)=>`
        <div class="hist-item" style="animation-delay:${i*.04}s">
          <span class="hist-icon">🚀</span>
          <div><div class="hist-nome">${v.naveIdentificador}</div><div class="hist-data">${v.dataHora}</div></div>
          <div><div class="hist-dist">${v.distancia}<span style="font-size:.7rem;color:var(--muted);margin-left:4px">anos-luz</span></div></div>
          <div><div class="hist-consumo">⛽ ${v.combustivelConsumido.toFixed(1)}</div></div>
        </div>`).join('');
    }

    /* 3D WebGL */
    let animId=null,glCtx=null;
    function abrir3D(nome,tipo){document.getElementById('modal-nome').textContent=nome;document.getElementById('modal-3d').classList.add('open');iniciar3D(tipo);}
    function fechar3D(){document.getElementById('modal-3d').classList.remove('open');if(animId)cancelAnimationFrame(animId);animId=null;}

    function iniciar3D(tipo){
      if(animId)cancelAnimationFrame(animId);
      const canvas=document.getElementById('canvas-3d');
      canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;
      const gl=canvas.getContext('webgl');glCtx=gl;
      if(!gl)return;
      gl.enable(gl.DEPTH_TEST);gl.clearColor(.03,.04,.09,1);

      const cores={cargueiro:[.3,.6,1],combate:[1,.35,.55],exploracao:[0,.85,1]};
      const cor=cores[tipo]||[.3,.6,1];

      const vsrc=`attribute vec3 p;attribute vec3 nm;uniform mat4 mvp;uniform mat4 mod;varying vec3 vn;varying vec3 vp;void main(){gl_Position=mvp*vec4(p,1);vn=normalize((mod*vec4(nm,0)).xyz);vp=(mod*vec4(p,1)).xyz;}`;
      const fsrc=`precision mediump float;varying vec3 vn;varying vec3 vp;uniform vec3 col;void main(){vec3 l=normalize(vec3(1,2,3));float d=max(dot(vn,l),0.);vec3 rim=col*pow(1.-max(dot(vn,normalize(vec3(0,0,1))),0.),2.)*.4;vec3 c=col*(.15+.75*d)+rim;gl_FragColor=vec4(c,.97);}`;

      function mkShader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
      const prog=gl.createProgram();
      gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,vsrc));
      gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,fsrc));
      gl.linkProgram(prog);gl.useProgram(prog);

      const geo=tipo==='cargueiro'?geoCargueiro():tipo==='combate'?geoCombate():geoExploracao();

      function mkBuf(data,target){const b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,data,gl.STATIC_DRAW);return b;}
      const vb=mkBuf(new Float32Array(geo.v),gl.ARRAY_BUFFER);
      const nb=mkBuf(new Float32Array(geo.n),gl.ARRAY_BUFFER);
      const ib=mkBuf(new Uint16Array(geo.i),gl.ELEMENT_ARRAY_BUFFER);

      const aP=gl.getAttribLocation(prog,'p'),aN=gl.getAttribLocation(prog,'nm');
      const uMVP=gl.getUniformLocation(prog,'mvp'),uMod=gl.getUniformLocation(prog,'mod'),uCol=gl.getUniformLocation(prog,'col');
      gl.uniform3fv(uCol,cor);

      let rotX=.3,rotY=0,drag=false,lx=0,ly=0,zoom=5;
      canvas.onmousedown=e=>{drag=true;lx=e.clientX;ly=e.clientY;};
      window.onmouseup=()=>drag=false;
      canvas.onmousemove=e=>{if(!drag)return;rotY+=(e.clientX-lx)*.012;rotX+=(e.clientY-ly)*.012;lx=e.clientX;ly=e.clientY;};
      canvas.onwheel=e=>{zoom=Math.max(2,Math.min(12,zoom+e.deltaY*.01));e.preventDefault();};
      canvas.ontouchstart=e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;};
      canvas.ontouchend=()=>drag=false;
      canvas.ontouchmove=e=>{if(!drag)return;rotY+=(e.touches[0].clientX-lx)*.012;rotX+=(e.touches[0].clientY-ly)*.012;lx=e.touches[0].clientX;ly=e.touches[0].clientY;e.preventDefault();};

      function m4mul(a,b){const r=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[i*4+k]*b[k*4+j];r[i*4+j]=s;}return r;}
      function mRX(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([1,0,0,0,0,c,-s,0,0,s,c,0,0,0,0,1]);}
      function mRY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,s,0,0,1,0,0,-s,0,c,0,0,0,0,1]);}
      function mPersp(fov,asp,near,far){const f=1/Math.tan(fov/2),r=new Float32Array(16);r[0]=f/asp;r[5]=f;r[10]=(far+near)/(near-far);r[11]=-1;r[14]=2*far*near/(near-far);return r;}
      function mTrans(z){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;m[14]=z;return m;}

      let t=0;
      function render(){
        animId=requestAnimationFrame(render);
        t+=.008;
        gl.viewport(0,0,canvas.width,canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
        const model=m4mul(mRX(rotX),mRY(rotY+t*.25));
        const mvp=m4mul(mPersp(.85,canvas.width/canvas.height,.1,100),m4mul(mTrans(-zoom),model));
        gl.uniformMatrix4fv(uMVP,false,mvp);gl.uniformMatrix4fv(uMod,false,model);
        gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,3,gl.FLOAT,false,0,0);
        gl.bindBuffer(gl.ARRAY_BUFFER,nb);gl.enableVertexAttribArray(aN);gl.vertexAttribPointer(aN,3,gl.FLOAT,false,0,0);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
        gl.drawElements(gl.TRIANGLES,geo.i.length,gl.UNSIGNED_SHORT,0);
      }
      render();
    }

    /* GEOMETRIAS */
    function geoCargueiro(){
      const v=[],n=[],i=[];
      function face(pts,nm){const b=v.length/3;pts.forEach(p=>{v.push(...p);n.push(...nm);});i.push(b,b+1,b+2,b,b+2,b+3);}
      const W=.8,H=.5,D=1.6;
      face([[-W,-H,-D],[W,-H,-D],[W,H,-D],[-W,H,-D]],[0,0,-1]);
      face([[-W,-H,D],[W,-H,D],[W,H,D],[-W,H,D]],[0,0,1]);
      face([[-W,-H,-D],[-W,-H,D],[-W,H,D],[-W,H,-D]],[-1,0,0]);
      face([[W,-H,-D],[W,-H,D],[W,H,D],[W,H,-D]],[1,0,0]);
      face([[-W,H,-D],[W,H,-D],[W,H,D],[-W,H,D]],[0,1,0]);
      face([[-W,-H,-D],[W,-H,-D],[W,-H,D],[-W,-H,D]],[0,-1,0]);
      // cockpit
      face([[-0.3,H,D-.5],[0.3,H,D-.5],[0.3,H+.3,D-.1],[-0.3,H+.3,D-.1]],[0,0,-1]);
      face([[-0.3,H,D],[0.3,H,D],[0.3,H+.3,D],[-0.3,H+.3,D]],[0,0,1]);
      face([[-0.3,H,D-.5],[-0.3,H,D],[-0.3,H+.3,D],[-0.3,H+.3,D-.1]],[-1,0,0]);
      face([[0.3,H,D-.5],[0.3,H,D],[0.3,H+.3,D],[0.3,H+.3,D-.1]],[1,0,0]);
      face([[-0.3,H+.3,D-.1],[0.3,H+.3,D-.1],[0.3,H+.3,D],[-0.3,H+.3,D]],[0,1,0]);
      // motor traseiro
      for(let k=0;k<12;k++){const a=k/12*Math.PI*2,b=(k+1)/12*Math.PI*2,r=.22;const nm=[Math.cos((a+b)/2),Math.sin((a+b)/2),0];face([[Math.cos(a)*r,Math.sin(a)*r,-D],[Math.cos(b)*r,Math.sin(b)*r,-D],[Math.cos(b)*r,Math.sin(b)*r,-D-.4],[Math.cos(a)*r,Math.sin(a)*r,-D-.4]],nm);}
      return{v,n,i};
    }

    function geoCombate(){
      const v=[],n=[],i=[];
      function tri(a,b,c){const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];const nm=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];const l=Math.hypot(...nm);const nn=nm.map(x=>x/l);const b2=v.length/3;v.push(...a,...b,...c);n.push(...nn,...nn,...nn);i.push(b2,b2+1,b2+2);}
      // fuselagem
      tri([0,0,2],[-1.4,-.15,-1.5],[-1.4,.15,-1.5]);tri([0,0,2],[1.4,-.15,-1.5],[1.4,.15,-1.5]);
      tri([0,0,2],[-1.4,-.15,-1.5],[1.4,-.15,-1.5]);tri([0,0,2],[1.4,.15,-1.5],[-1.4,.15,-1.5]);
      tri([-1.4,-.15,-1.5],[1.4,-.15,-1.5],[1.4,.15,-1.5]);tri([-1.4,-.15,-1.5],[1.4,.15,-1.5],[-1.4,.15,-1.5]);
      tri([0,.5,-1],[0,0,2],[-1.4,.15,-1.5]);tri([0,.5,-1],[0,0,2],[1.4,.15,-1.5]);tri([0,.5,-1],[1.4,.15,-1.5],[-1.4,.15,-1.5]);
      // asas
      tri([-0.4,0,.2],[-2.4,-.1,-1.5],[-0.4,0,-1.5]);tri([-0.4,0,.2],[-2.4,-.1,.2],[-2.4,-.1,-1.5]);
      tri([0.4,0,.2],[2.4,-.1,-1.5],[0.4,0,-1.5]);tri([0.4,0,.2],[2.4,-.1,.2],[2.4,-.1,-1.5]);
      // canhões
      for(const sx of[-1.1,1.1])for(let k=0;k<8;k++){const a=k/8*Math.PI*2,b=(k+1)/8*Math.PI*2,r=.07;tri([sx+Math.cos(a)*r,Math.sin(a)*r,-1.5],[sx+Math.cos(b)*r,Math.sin(b)*r,-1.5],[sx,0,-2.2]);}
      return{v,n,i};
    }

    function geoExploracao(){
      const v=[],n=[],i=[];
      function tri(a,b,c){const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];const nm=[ab[1]*ac[2]-ab[2]*ac[1],ab[2]*ac[0]-ab[0]*ac[2],ab[0]*ac[1]-ab[1]*ac[0]];const l=Math.hypot(...nm);const nn=nm.map(x=>x/l);const b2=v.length/3;v.push(...a,...b,...c);n.push(...nn,...nn,...nn);i.push(b2,b2+1,b2+2);}
      const S=16;
      for(let k=0;k<S;k++){const a=k/S*Math.PI*2,b=(k+1)/S*Math.PI*2,r=.4,r2=.25;tri([Math.cos(a)*r,Math.sin(a)*r,-1.5],[Math.cos(b)*r,Math.sin(b)*r,-1.5],[Math.cos(b)*r2,Math.sin(b)*r2,1.5]);tri([Math.cos(a)*r,Math.sin(a)*r,-1.5],[Math.cos(b)*r2,Math.sin(b)*r2,1.5],[Math.cos(a)*r2,Math.sin(a)*r2,1.5]);}
      // nariz
      for(let k=0;k<S;k++){const a=k/S*Math.PI*2,b=(k+1)/S*Math.PI*2;tri([Math.cos(a)*.25,Math.sin(a)*.25,1.5],[Math.cos(b)*.25,Math.sin(b)*.25,1.5],[0,0,2.2]);}
      // antena dish
      for(let k=0;k<12;k++){const a=k/12*Math.PI*2,b=(k+1)/12*Math.PI*2;tri([0,.45,-1.8],[Math.cos(a)*.35,.4+Math.sin(a)*.12,-2.2],[Math.cos(b)*.35,.4+Math.sin(b)*.12,-2.2]);}
      // painéis solares
      function painel(ox){tri([ox,0,.2],[ox,0,-.6],[ox<0?ox+.6:ox-.6,0,-.6]);tri([ox,0,.2],[ox<0?ox+.6:ox-.6,0,-.6],[ox<0?ox+.6:ox-.6,0,.2]);}
      painel(.55);painel(-.55);
      return{v,n,i};
    }

    carregarFrota();
</script>
</body>
