<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMOS FLEET — Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root{--void:#03040d;--glow-blue:#4d9fff;--glow-cyan:#00e5ff;--glow-purple:#9d4dff;--text:#ccd6f6;--muted:#4a5580;--danger:#ff4466;--warn:#ffaa00;--success:#00ff99;--card-bg:rgba(13,18,48,0.75);--border:rgba(77,159,255,0.15);}
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;overflow-x:hidden;background:var(--void);color:var(--text);font-family:'Rajdhani',sans-serif;cursor:none;}
        #cursor{position:fixed;width:10px;height:10px;background:var(--glow-cyan);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .15s;box-shadow:0 0 10px var(--glow-cyan);}
        #cursor-ring{position:fixed;width:34px;height:34px;border:1px solid rgba(0,229,255,.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s;}
        #starfield{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;}
        .nebula-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 30%,rgba(77,79,255,.07) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 80% 70%,rgba(157,77,255,.07) 0%,transparent 60%);pointer-events:none;}
        body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:9990;}
        nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:rgba(3,4,13,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
        .nav-logo{display:flex;align-items:center;gap:12px;}
        .nav-ring{width:32px;height:32px;position:relative;display:flex;align-items:center;justify-content:center;}
        .nav-ring::before{content:'';position:absolute;inset:0;border:2px solid var(--glow-cyan);border-radius:50%;animation:spin 8s linear infinite;}
        .nav-ring::after{content:'';position:absolute;inset:4px;border:1px solid var(--glow-purple);border-radius:50%;animation:spin 5s linear infinite reverse;}
        .nav-dot{width:6px;height:6px;background:var(--glow-cyan);border-radius:50%;box-shadow:0 0 8px var(--glow-cyan);}
        .nav-title{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 15px var(--glow-cyan);}
        .nav-tabs{display:flex;gap:4px;}
        .nav-tab{padding:8px 20px;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:none;transition:all .25s;background:transparent;border:1px solid transparent;color:var(--muted);}
        .nav-tab:hover{color:var(--text);border-color:var(--border);}
        .nav-tab.active{color:var(--glow-cyan);border-color:rgba(0,229,255,.3);background:rgba(0,229,255,.05);}
        .nav-status{display:flex;align-items:center;gap:8px;font-size:.7rem;letter-spacing:2px;color:var(--muted);}
        .status-dot{width:6px;height:6px;background:var(--success);border-radius:50%;box-shadow:0 0 8px var(--success);animation:pulse 2s infinite;}
        @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        @keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
        @keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
        @keyframes toastOut{from{opacity:1;}to{opacity:0;transform:translateX(20px);}}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
        #app{position:relative;z-index:1;padding-top:64px;}
        .page{display:none;padding:40px;max-width:1400px;margin:0 auto;}
        .page.active{display:block;}
        .sec-hdr{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
        .sec-title{font-family:'Orbitron',sans-serif;font-size:.75rem;letter-spacing:4px;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
        .sec-line{flex:1;height:1px;background:var(--border);}
        .stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;}
        .stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px 24px;backdrop-filter:blur(20px);position:relative;overflow:hidden;}
        .stat-card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--glow-cyan),transparent);opacity:.5;}
        .stat-lbl{font-size:.65rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
        .stat-val{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:700;color:#fff;}
        .stat-val span{font-size:.9rem;color:var(--muted);font-weight:400;}
        .frota-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:24px;}
        .nave-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:28px;backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s;animation:fadeUp .5s ease both;}
        .nave-card:hover{transform:translateY(-6px);border-color:rgba(77,159,255,.3);box-shadow:0 20px 60px rgba(0,0,0,.4);}
        .nave-card::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--glow-cyan),transparent);opacity:0;transition:opacity .3s;}
        .nave-card:hover::before{opacity:1;}
        .card-glow{position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;opacity:.04;pointer-events:none;}
        .nave-card:hover .card-glow{opacity:.08;}
        .gb{background:var(--glow-blue);}.gp{background:var(--glow-purple);}.gc{background:var(--glow-cyan);}
        .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;}
        .card-id{display:flex;align-items:center;gap:14px;}
        .nave-ico{width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;font-size:1.5rem;}
        .nave-nm{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;color:#fff;letter-spacing:1px;margin-bottom:4px;}
        .nave-tp{font-size:.7rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
        .badge{padding:4px 10px;border-radius:6px;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;border:1px solid;}
        .bc{color:#ffaa00;border-color:rgba(255,170,0,.3);background:rgba(255,170,0,.05);}
        .bx{color:#ff6688;border-color:rgba(255,100,136,.3);background:rgba(255,100,136,.05);}
        .be{color:#00e5ff;border-color:rgba(0,229,255,.3);background:rgba(0,229,255,.05);}
        .fuel-sec{margin-bottom:18px;}
        .fuel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
        .fuel-lbl{font-size:.7rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
        .fuel-val{font-family:'Orbitron',sans-serif;font-size:.8rem;color:var(--text);}
        .fuel-sub{font-size:.7rem;color:var(--muted);margin-left:6px;}
        .fuel-track{height:5px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;}
        .fuel-bar{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.4,0,.2,1);position:relative;}
        .fuel-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);background-size:200% 100%;animation:shimmer 2s infinite;}
        .fa{background:linear-gradient(90deg,#0066ff,#00e5ff);box-shadow:0 0 10px rgba(0,229,255,.5);}
        .fm{background:linear-gradient(90deg,#cc6600,#ffaa00);box-shadow:0 0 10px rgba(255,170,0,.5);}
        .fb{background:linear-gradient(90deg,#990022,#ff4466);box-shadow:0 0 10px rgba(255,68,102,.5);animation:blink 1s infinite;}
        .extras{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
        .etag{padding:4px 10px;border-radius:6px;font-size:.68rem;letter-spacing:1px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--muted);}
        .etag.on{color:var(--success);border-color:rgba(0,255,153,.2);background:rgba(0,255,153,.04);}
        .etag.warn{color:var(--warn);border-color:rgba(255,170,0,.2);}
        .div{height:1px;background:var(--border);margin:16px 0;}
        .acoes{display:flex;flex-direction:column;gap:10px;}
        .arow{display:flex;gap:8px;align-items:center;}
        .ainp{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 13px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s;cursor:none;}
        .ainp::placeholder{color:var(--muted);}
        .ainp:focus{border-color:rgba(77,159,255,.4);background:rgba(77,159,255,.04);}
        .abtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid;font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:none;transition:all .25s;white-space:nowrap;background:transparent;}
        .abtn:active{transform:scale(.96);}
        .bv{color:var(--glow-blue);border-color:rgba(77,159,255,.3);}.bv:hover{background:rgba(77,159,255,.1);border-color:var(--glow-blue);}
        .ba{color:var(--success);border-color:rgba(0,255,153,.3);}.ba:hover{background:rgba(0,255,153,.08);border-color:var(--success);}
        .bd{color:var(--danger);border-color:rgba(255,68,102,.3);}.bd:hover{background:rgba(255,68,102,.08);border-color:var(--danger);}
        .b3{color:var(--glow-purple);border-color:rgba(157,77,255,.3);}.b3:hover{background:rgba(157,77,255,.08);border-color:var(--glow-purple);}
        .toast-wrap{position:fixed;bottom:32px;right:32px;z-index:1000;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
        .toast{display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:12px;font-size:.85rem;backdrop-filter:blur(20px);border:1px solid;animation:toastIn .3s ease,toastOut .3s ease 2.7s both;max-width:360px;}
        .tok{background:rgba(0,255,153,.08);border-color:rgba(0,255,153,.3);color:var(--success);}
        .ter{background:rgba(255,68,102,.08);border-color:rgba(255,68,102,.3);color:var(--danger);}
        .form-card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:36px;backdrop-filter:blur(20px);max-width:640px;animation:fadeUp .4s ease;}
        .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
        .fgrp{display:flex;flex-direction:column;gap:6px;}
        .fgrp.full{grid-column:1/-1;}
        .flbl{font-size:.68rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
        .finp,.fsel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;cursor:none;width:100%;}
        .finp:focus,.fsel:focus{border-color:rgba(77,159,255,.4);background:rgba(77,159,255,.04);}
        .fsel option{background:#0d1230;color:var(--text);}
        .fext{display:none;grid-column:1/-1;}
        .fext.show{display:contents;}
        .trow{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;}
        .tlbl{font-size:.9rem;color:var(--text);}
        .tog{position:relative;width:40px;height:22px;}
        .tog input{opacity:0;width:0;height:0;}
        .sld{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:999px;cursor:none;transition:.3s;}
        .sld::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.3s;}
        .tog input:checked+.sld{background:rgba(0,255,153,.2);border:1px solid rgba(0,255,153,.4);}
        .tog input:checked+.sld::before{transform:translateX(18px);background:var(--success);}
        .btn-criar{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(0,229,255,.3);background:rgba(0,229,255,.06);color:var(--glow-cyan);font-family:'Orbitron',sans-serif;font-size:.8rem;letter-spacing:3px;cursor:none;transition:all .3s;margin-top:8px;}
        .btn-criar:hover{background:rgba(0,229,255,.12);box-shadow:0 0 30px rgba(0,229,255,.15);}
        .hist-list{display:flex;flex-direction:column;gap:10px;}
        .hist-item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:16px;padding:14px 20px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(20px);animation:fadeUp .3s ease both;}
        .hist-nm{font-family:'Orbitron',sans-serif;font-size:.8rem;color:var(--text);margin-bottom:3px;}
        .hist-dt{font-size:.7rem;color:var(--muted);letter-spacing:1px;}
        .hist-di{font-family:'Orbitron',sans-serif;font-size:.85rem;color:var(--glow-blue);text-align:right;}
        .hist-co{font-size:.7rem;color:var(--muted);text-align:right;}
        .empty{text-align:center;padding:80px;color:var(--muted);font-family:'Orbitron',sans-serif;font-size:.8rem;letter-spacing:4px;}
        #modal-3d{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(3,4,13,.92);backdrop-filter:blur(16px);}
        #modal-3d.open{display:flex;}
        .m3-inner{position:relative;width:700px;max-width:95vw;}
        .m3-close{position:absolute;top:-48px;right:0;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.8rem;letter-spacing:2px;padding:6px 14px;cursor:none;transition:all .2s;}
        .m3-close:hover{color:var(--danger);border-color:rgba(255,68,102,.4);}
        #canvas-3d{width:100%;height:480px;border-radius:20px;border:1px solid var(--border);display:block;background:rgba(5,7,20,.95);}
        .m3-info{margin-top:16px;text-align:center;}
        .m3-nm{font-family:'Orbitron',sans-serif;font-size:1rem;color:#fff;letter-spacing:3px;margin-bottom:4px;}
        .m3-hint{font-size:.75rem;color:var(--muted);letter-spacing:2px;}
        ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--void);}::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px;}
        .loading{text-align:center;padding:80px 0;color:var(--muted);font-family:'Orbitron',sans-serif;font-size:.8rem;letter-spacing:4px;}
    </style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="nebula-bg"></div>
<div id="cursor"></div>
<div id="cursor-ring"></div>
<div class="toast-wrap" id="toasts"></div>

<div id="modal-3d">
    <div class="m3-inner">
        <button class="m3-close" onclick="fechar3D()">✕ FECHAR</button>
        <canvas id="canvas-3d"></canvas>
        <div class="m3-info">
            <div class="m3-nm" id="modal-nome"></div>
            <div class="m3-hint">🖱 Arraste para girar · Scroll para zoom</div>
        </div>
    </div>
</div>

<nav>
    <div class="nav-logo">
        <div class="nav-ring"><div class="nav-dot"></div></div>
        <span class="nav-title">COSMOS</span>
    </div>
    <div class="nav-tabs">
        <button class="nav-tab active" id="tab-frota" onclick="irPara('frota')">⬡ Frota</button>
        <button class="nav-tab" id="tab-adicionar" onclick="irPara('adicionar')">＋ Nova Nave</button>
        <button class="nav-tab" id="tab-historico" onclick="irPara('historico')">◈ Histórico</button>
    </div>
    <div class="nav-status"><div class="status-dot"></div>SISTEMA ONLINE</div>
</nav>

<div id="app">
    <div class="page active" id="page-frota">
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-lbl">Naves na Frota</div><div class="stat-val" id="sn">—</div></div>
            <div class="stat-card"><div class="stat-lbl">Combustível Médio</div><div class="stat-val" id="sc">—<span>%</span></div></div>
            <div class="stat-card"><div class="stat-lbl">Naves em Alerta</div><div class="stat-val" id="sa" style="color:var(--danger)">—</div></div>
        </div>
        <div class="sec-hdr"><span class="sec-title">Frota Ativa</span><div class="sec-line"></div></div>
        <div class="frota-grid" id="frota"><div class="loading">CARREGANDO FROTA...</div></div>
    </div>

    <div class="page" id="page-adicionar">
        <div class="sec-hdr"><span class="sec-title">Recrutar Nova Nave</span><div class="sec-line"></div></div>
        <div class="form-card">
            <div class="fgrid">
                <div class="fgrp full"><label class="flbl">Identificador</label><input class="finp" id="fi" placeholder="Nome ou código" type="text"></div>
                <div class="fgrp"><label class="flbl">Tipo</label>
                    <select class="fsel" id="ft" onchange="updateExtras()">
                        <option value="">— Selecionar —</option>
                        <option value="cargueiro">📦 Cargueiro</option>
                        <option value="combate">⚔️ Combate</option>
                        <option value="exploracao">🔭 Exploração</option>
                    </select>
                </div>
                <div class="fgrp"><label class="flbl">Velocidade Base</label><input class="finp" id="fv" placeholder="Ex: 120" type="number"></div>
                <div class="fgrp"><label class="flbl">Combustível Máximo</label><input class="finp" id="fc" placeholder="Ex: 1000" type="number"></div>
                <div class="fgrp fext" id="ex-carg"><label class="flbl">Cap. Máxima de Carga</label><input class="finp" id="fcg" placeholder="Ex: 500" type="number"></div>
                <div class="fgrp fext" id="ex-armas"><label class="flbl">Número de Armas</label><input class="finp" id="far" placeholder="Ex: 4" type="number"></div>
                <div class="fgrp fext" id="ex-escudo"><label class="flbl">Escudo</label><div class="trow"><span class="tlbl">Escudo Ativado</span><label class="tog"><input type="checkbox" id="fes"><span class="sld"></span></label></div></div>
                <div class="fgrp fext" id="ex-sens"><label class="flbl">Sensores</label><div class="trow"><span class="tlbl">Sensores Avançados</span><label class="tog"><input type="checkbox" id="fse"><span class="sld"></span></label></div></div>
            </div>
            <button class="btn-criar" onclick="criarNave()">⊕ RECRUTAR NAVE</button>
        </div>
    </div>

    <div class="page" id="page-historico">
        <div class="sec-hdr">
            <span class="sec-title">Histórico de Viagens</span>
            <div class="sec-line"></div>
            <button class="nav-tab" onclick="carregarHist()" style="padding:6px 14px;font-size:.75rem;">↻ Atualizar</button>
        </div>
        <div class="hist-list" id="hist"><div class="loading">CARREGANDO...</div></div>
    </div>
</div>

<!-- Three.js DEVE estar antes do script principal -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    /* ── CURSOR ── */
    const cur=document.getElementById('cursor'),rng=document.getElementById('cursor-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
    (function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;rng.style.left=rx+'px';rng.style.top=ry+'px';requestAnimationFrame(loop);})();
    function bindCur(){document.querySelectorAll('button,input,select').forEach(el=>{el.addEventListener('mouseenter',()=>{cur.style.transform='translate(-50%,-50%) scale(2)';rng.style.width='50px';rng.style.height='50px';});el.addEventListener('mouseleave',()=>{cur.style.transform='translate(-50%,-50%) scale(1)';rng.style.width='34px';rng.style.height='34px';});});}
    bindCur();

    /* ── STARFIELD ── */
    const cv=document.getElementById('starfield'),cx2=cv.getContext('2d');
    let stars=[];
    function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
    function initStars(){stars=Array.from({length:300},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.2+.2,speed:Math.random()*.4+.05,op:Math.random()*.7+.1,tw:Math.random()*Math.PI*2}));}
    function drawStars(){cx2.clearRect(0,0,cv.width,cv.height);stars.forEach(s=>{s.y+=s.speed;s.tw+=.02;if(s.y>cv.height){s.y=0;s.x=Math.random()*cv.width;}const o=s.op*(.7+.3*Math.sin(s.tw));cx2.beginPath();cx2.arc(s.x,s.y,s.r,0,Math.PI*2);cx2.fillStyle=`rgba(200,216,255,${o})`;cx2.fill();});requestAnimationFrame(drawStars);}
    window.addEventListener('resize',()=>{resize();initStars();});
    resize();initStars();drawStars();

    /* ── NAVEGAÇÃO ── */
    function irPara(pg){
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
      document.getElementById('page-'+pg).classList.add('active');
      document.getElementById('tab-'+pg).classList.add('active');
      if(pg==='frota')carregarFrota();
      if(pg==='historico')carregarHist();
    }

    /* ── TIPOS ── */
    function tipo(n){if('pesoCargaAtual'in n)return'cargueiro';if('numeroArmas'in n)return'combate';return'exploracao';}
    const TI={cargueiro:{icon:'📦',lbl:'Cargueiro',badge:'bc',gl:'gb'},combate:{icon:'⚔️',lbl:'Combate',badge:'bx',gl:'gp'},exploracao:{icon:'🔭',lbl:'Exploração',badge:'be',gl:'gc'}};

    function renderExtras(n,t){
      let s='';
      if(t==='cargueiro')s+=`<span class="etag warn">⚖ Carga: ${n.pesoCargaAtual}/${n.capacidadeMaximaCarga}t</span>`;
      if(t==='combate'){s+=`<span class="etag warn">⚔ Armas: ${n.numeroArmas}</span>`;s+=`<span class="etag ${n.escudoAtivado?'on':''}">🛡 Escudo: ${n.escudoAtivado?'ON':'OFF'}</span>`;}
      if(t==='exploracao')s+=`<span class="etag ${n.possuiSensoresAvancados?'on':''}">📡 Sensores: ${n.possuiSensoresAvancados?'ON':'OFF'}</span>`;
      return s?`<div class="extras">${s}</div>`:'';
    }

    function renderCard(n,i){
      const t=tipo(n),inf=TI[t];
      const pct=(n.combustivelAtual/n.combustivelMaximo*100).toFixed(1);
      const nv=pct>60?'fa':pct>25?'fm':'fb';
      const sid=n.identificador.replace(/[^a-zA-Z0-9]/g,'_');
      const enc=encodeURIComponent(n.identificador);
      return `<div class="nave-card" style="animation-delay:${i*.1}s">
        <div class="card-glow ${inf.gl}"></div>
        <div class="card-top">
          <div class="card-id"><div class="nave-ico">${inf.icon}</div><div><div class="nave-nm">${n.identificador}</div><div class="nave-tp">${inf.lbl}</div></div></div>
          <div class="badge ${inf.badge}">${inf.lbl}</div>
        </div>
        <div class="fuel-sec">
          <div class="fuel-hdr"><span class="fuel-lbl">⛽ Combustível</span><span class="fuel-val">${n.combustivelAtual.toFixed(0)}<span class="fuel-sub">/ ${n.combustivelMaximo} (${pct}%)</span></span></div>
          <div class="fuel-track"><div class="fuel-bar ${nv}" style="width:${pct}%"></div></div>
        </div>
        ${renderExtras(n,t)}
        <div class="div"></div>
        <div class="acoes">
          <div class="arow"><input class="ainp" type="number" id="d-${sid}" placeholder="Distância em anos-luz" min="1"><button class="abtn bv" onclick="viajar('${n.identificador}','${sid}','${enc}')">🚀 Viajar</button></div>
          <div class="arow"><input class="ainp" type="number" id="c-${sid}" placeholder="Qtd. combustível" min="1"><button class="abtn ba" onclick="abastecer('${n.identificador}','${sid}','${enc}')">⛽ Abastecer</button></div>
          <div class="arow" style="justify-content:space-between;">
            <button class="abtn b3" onclick="abrir3D('${n.identificador}','${t}')">◈ Ver em 3D</button>
            <button class="abtn bd" onclick="deletar('${n.identificador}','${enc}')">✕ Remover</button>
          </div>
        </div>
      </div>`;
    }

    function stats(naves){
      document.getElementById('sn').textContent=naves.length;
      const m=naves.reduce((a,n)=>a+(n.combustivelAtual/n.combustivelMaximo*100),0)/naves.length;
      document.getElementById('sc').innerHTML=m.toFixed(0)+'<span>%</span>';
      document.getElementById('sa').textContent=naves.filter(n=>n.combustivelAtual/n.combustivelMaximo<.25).length;
    }

    async function carregarFrota(){
      document.getElementById('frota').innerHTML='<div class="loading">CARREGANDO FROTA...</div>';
      try{
        const d=await(await fetch('/naves')).json();
        stats(d);
        document.getElementById('frota').innerHTML=d.length?d.map((n,i)=>renderCard(n,i)).join(''):'<div class="loading">FROTA VAZIA</div>';
        bindCur();
      }catch(e){document.getElementById('frota').innerHTML='<div class="loading">FALHA NA CONEXÃO</div>';}
    }

    function toast(msg,ok){
      const el=document.createElement('div');
      el.className=`toast ${ok?'tok':'ter'}`;
      el.innerHTML=`<span>${ok?'✓':'✕'}</span> ${msg}`;
      document.getElementById('toasts').appendChild(el);
      setTimeout(()=>el.remove(),3100);
    }

    async function viajar(nm,sid,enc){const v=document.getElementById('d-'+sid).value;if(!v)return toast('Digite uma distância!',false);const r=await fetch(`/naves/${enc}/viajar?distancia=${v}`,{method:'POST'});toast(await r.text(),r.ok);if(r.ok)carregarFrota();}
    async function abastecer(nm,sid,enc){const v=document.getElementById('c-'+sid).value;if(!v)return toast('Digite uma quantidade!',false);const r=await fetch(`/naves/${enc}/abastecer?quantidade=${v}`,{method:'PATCH'});toast(await r.text(),r.ok);if(r.ok)carregarFrota();}
    async function deletar(nm,enc){if(!confirm(`Remover "${nm}" da frota?`))return;const r=await fetch(`/naves/${enc}`,{method:'DELETE'});toast(await r.text(),r.ok);if(r.ok)carregarFrota();}

    function updateExtras(){
      const t=document.getElementById('ft').value;
      document.querySelectorAll('.fext').forEach(e=>e.classList.remove('show'));
      if(t==='cargueiro')document.getElementById('ex-carg').classList.add('show');
      if(t==='combate'){document.getElementById('ex-armas').classList.add('show');document.getElementById('ex-escudo').classList.add('show');}
      if(t==='exploracao')document.getElementById('ex-sens').classList.add('show');
    }

    async function criarNave(){
      const id=document.getElementById('fi').value.trim(),t=document.getElementById('ft').value,vel=parseFloat(document.getElementById('fv').value),cb=parseFloat(document.getElementById('fc').value);
      if(!id||!t||!vel||!cb)return toast('Preencha todos os campos!',false);
      const body={identificador:id,tipo:t,velocidadeBase:vel,combustivelMaximo:cb};
      if(t==='cargueiro')body.capacidadeMaximaCarga=parseFloat(document.getElementById('fcg').value)||0;
      if(t==='combate'){body.numeroArmas=parseInt(document.getElementById('far').value)||0;body.escudoAtivado=document.getElementById('fes').checked;}
      if(t==='exploracao')body.possuiSensoresAvancados=document.getElementById('fse').checked;
      const r=await fetch('/naves',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok){toast('Nave recrutada!',true);document.getElementById('fi').value='';irPara('frota');}
      else toast(await r.text(),false);
    }

    async function carregarHist(){
      document.getElementById('hist').innerHTML='<div class="loading">CARREGANDO...</div>';
      const d=await(await fetch('/naves/historico')).json();
      if(!d.length){document.getElementById('hist').innerHTML='<div class="empty">NENHUMA VIAGEM REGISTRADA</div>';return;}
      document.getElementById('hist').innerHTML=d.slice().reverse().map((v,i)=>`
        <div class="hist-item" style="animation-delay:${i*.04}s">
          <span style="font-size:1.2rem">🚀</span>
          <div><div class="hist-nm">${v.naveIdentificador}</div><div class="hist-dt">${v.dataHora}</div></div>
          <div><div class="hist-di">${v.distancia}<span style="font-size:.7rem;color:var(--muted);margin-left:4px">anos-luz</span></div></div>
          <div><div class="hist-co">⛽ ${v.combustivelConsumido.toFixed(1)}</div></div>
        </div>`).join('');
    }

    /* ── 3D com Three.js ── */
    let animId=null, threeRenderer=null;

    function abrir3D(nome, tipo) {
      document.getElementById('modal-nome').textContent = nome;
      document.getElementById('modal-3d').classList.add('open');
      setTimeout(() => iniciar3D(tipo), 200);
    }

    function fechar3D() {
      document.getElementById('modal-3d').classList.remove('open');
      if(animId){ cancelAnimationFrame(animId); animId=null; }
      if(threeRenderer){ threeRenderer.dispose(); threeRenderer=null; }
    }

    function iniciar3D(tipo) {
      if(animId){ cancelAnimationFrame(animId); animId=null; }
      if(threeRenderer){ threeRenderer.dispose(); threeRenderer=null; }

      const canvas = document.getElementById('canvas-3d');
      const W = canvas.clientWidth || 700;
      const H = canvas.clientHeight || 480;

      threeRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      threeRenderer.setSize(W, H);
      threeRenderer.setClearColor(0x03040d);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 100);
      camera.position.z = 5.5;

      // Luzes
      scene.add(new THREE.AmbientLight(0xffffff, 0.3));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(3, 4, 5);
      scene.add(dirLight);
      const backLight = new THREE.DirectionalLight(0x4466ff, 0.3);
      backLight.position.set(-3, -2, -3);
      scene.add(backLight);

      // Cor por tipo
      const cores = { cargueiro: 0x4d9fff, combate: 0xff4466, exploracao: 0x00e5ff };
      const cor = cores[tipo] || 0x4d9fff;
      const mat = new THREE.MeshPhongMaterial({ color: cor, shininess: 80, specular: 0x224488 });

      // Montar nave
      const group = new THREE.Group();
      if(tipo === 'cargueiro') montarCargueiro(group, mat);
      else if(tipo === 'combate') montarCombate(group, mat);
      else montarExploracao(group, mat);
      scene.add(group);

      // Controles mouse
      let drag=false, lx=0, ly=0;
      canvas.onmousedown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
      window.onmouseup = () => drag=false;
      canvas.onmousemove = e => {
        if(!drag) return;
        group.rotation.y += (e.clientX-lx) * 0.013;
        group.rotation.x += (e.clientY-ly) * 0.013;
        lx=e.clientX; ly=e.clientY;
      };
      canvas.onwheel = e => {
        camera.position.z = Math.max(2, Math.min(12, camera.position.z + e.deltaY * 0.01));
        e.preventDefault();
      };

      // Loop de render
      function render() {
        animId = requestAnimationFrame(render);
        group.rotation.y += 0.005;
        threeRenderer.render(scene, camera);
      }
      render();
    }

    function montarCargueiro(g, mat) {
      // Corpo
      g.add(new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 3.0), mat));
      // Cockpit
      const ck = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.0), mat);
      ck.position.set(0, 0.8, 0.8);
      g.add(ck);
      // Motor
      const mo = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.8, 12), mat);
      mo.rotation.x = Math.PI/2;
      mo.position.set(0, 0, -2.0);
      g.add(mo);
    }

    function montarCombate(g, mat) {
      // Fuselagem
      const f = new THREE.Mesh(new THREE.ConeGeometry(0.5, 3.5, 4), mat);
      f.rotation.x = Math.PI/2;
      g.add(f);
      // Asas e canhões
      for(const sx of [-1, 1]) {
        const asa = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 1.8), mat);
        asa.position.set(sx * 1.0, -0.1, 0.2);
        g.add(asa);
        const can = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.2, 8), mat);
        can.rotation.x = Math.PI/2;
        can.position.set(sx * 1.5, -0.1, -1.2);
        g.add(can);
      }
    }

    function montarExploracao(g, mat) {
      // Corpo cilíndrico
      const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 3.2, 16), mat);
      corpo.rotation.x = Math.PI/2;
      g.add(corpo);
      // Nariz
      const nariz = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.9, 16), mat);
      nariz.rotation.x = -Math.PI/2;
      nariz.position.set(0, 0, 2.05);
      g.add(nariz);
      // Antena dish
      const dish = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8, 0, Math.PI*2, 0, Math.PI/2), mat);
      dish.rotation.x = Math.PI;
      dish.position.set(0, 0.55, -0.8);
      g.add(dish);
      // Painéis solares
      for(const sx of [-1, 1]) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.7), mat);
        p.position.set(sx * 0.95, 0, -0.2);
        g.add(p);
      }
    }

    carregarFrota();
</script>
</body>
</html>
